<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>AmarOsud | Your Health, Connected</title>

<style>
:root{--green:#087f5b;--dark:#064b38;--mint:#e9f7f1;--bg:#f6faf8;--text:#19382e;--muted:#72847b;--line:#e4eee8;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100% - 1160px)/2),20px);position:sticky;top:0;z-index:20}
.logo{font-size:24px;font-weight:800;color:var(--green);letter-spacing:-.7px}
.logo span{color:var(--text)}
.actions{display:flex;align-items:center;gap:9px}
.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700}
.primary{background:var(--green);color:white}
.primary:hover{background:var(--dark)}
.light{background:var(--mint);color:var(--green)}
.outline{background:white;border:1px solid var(--line);color:var(--text)}
.container{max-width:1160px;margin:auto;padding:30px 20px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:54px 48px;background:linear-gradient(115deg,#064b38,#087f5b 65%,#27a77d);color:white;display:flex;align-items:center;justify-content:space-between;min-height:300px}
.hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff30;border-radius:50%;right:9%;top:-100px;box-shadow:0 0 0 35px #ffffff0c,0 0 0 75px #ffffff08}
.heroText{position:relative;z-index:1;max-width:650px}
.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.15;margin:0 0 16px;letter-spacing:-1px}
.hero p{font-size:16px;line-height:1.8;color:#e2f5ec;max-width:560px}
.hero .btn{background:white;color:var(--green);margin-top:12px}
.heroArt{font-size:100px;position:relative;z-index:1;margin-right:35px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:35px 0 18px}
.sectionTitle h2{margin:0;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 5px 18px #123b2810}
.serviceIcon{width:52px;height:52px;background:var(--mint);border-radius:15px;display:grid;place-items:center;font-size:27px}
.card h3{margin:15px 0 7px}
.card p{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 16px}
.card button{font-size:13px}
.auth{max-width:450px;margin:40px auto;padding:0 15px}
.authbox{background:white;border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 8px 30px #123b280b}
.authbox h2{margin:0 0 8px}
.field{margin:15px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white;outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.full{width:100%}
.small{font-size:13px;color:var(--muted);line-height:1.7}
.msg{display:none;padding:12px;border-radius:10px;margin:12px 0;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.ok{background:#e9f7ef;color:#17613f}
.err{background:#fff0ef;color:#a32c25}
.link{color:var(--green);font-weight:bold;cursor:pointer}
.switch{text-align:center;font-size:14px;color:var(--muted);margin-top:16px}
.hidden{display:none!important}
.app{display:none;min-height:calc(100vh - 70px)}
.layout{max-width:1160px;margin:auto;display:flex;min-height:calc(100vh - 70px)}
.sidebar{width:245px;flex-shrink:0;background:white;border-right:1px solid var(--line);padding:23px 14px}
.userbox{background:var(--mint);border-radius:13px;padding:14px;margin-bottom:19px;overflow-wrap:anywhere}
.userbox strong{display:block;margin-bottom:5px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#5d7167;text-align:left;padding:12px;border-radius:10px;margin:3px 0;font-weight:600}
.navbtn.active,.navbtn:hover{background:var(--mint);color:var(--green)}
.navicon{width:22px;text-align:center;font-size:18px}
.main{flex:1;min-width:0;padding:29px}
.mobileNav{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-size:25px;margin:0}
.tag{background:var(--mint);color:var(--green);font-size:11px;font-weight:bold;padding:6px 10px;border-radius:20px}
.notice{background:#fff8e8;border:1px solid #f0e4c5;color:#74571d;padding:14px;border-radius:12px;font-size:13px;line-height:1.7;margin:18px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}
.moreMenu{position:fixed;bottom:75px;right:12px;background:white;border:1px solid var(--line);box-shadow:0 8px 30px #0002;border-radius:15px;padding:10px;width:210px;z-index:30}
.moreMenu button{display:block;width:100%;text-align:left;border:0;background:white;padding:12px;border-radius:9px;color:var(--text)}
.moreMenu button:hover{background:var(--mint)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:28px}
@media(max-width:800px){
 .top{padding:0 15px}
 .hero{padding:36px 25px;min-height:255px}
 .heroArt{font-size:75px;margin:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .layout{display:block}
 .sidebar{display:none}
 .main{padding:20px 15px 95px}
 .mobileNav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px max(7px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px #123b2809}
 .mobileNav .navbtn{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:7px 2px;margin:0;font-size:11px;text-align:center}
 .mobileNav .navicon{font-size:19px}
}
@media(max-width:480px){
 .logo{font-size:21px}
 .top{height:62px}
 .hero{padding:30px 22px;border-radius:18px}
 .heroArt{display:none}
 .hero h1{font-size:34px}
 .grid{gap:11px}
 .card{padding:16px}
 .card h3{font-size:15px}
 .card p{font-size:13px}
 .container{padding:20px 13px}
 .main{padding:18px 13px 95px}
}
</style>
</head>
<body>

<header class="top">
 <div class="logo">💚 Amar<span>Osud</span></div>
 <div class="actions">
  <button class="btn outline" id="languageBtn" onclick="toggleLanguage()">বাংলা</button>
  <div id="guestActions">

  </div>

  </div>

</header>

    <button class="btn" onclick="showAuth('register')" data-t="getStarted">Get Started →</button>
   </div>
   <div class="heroArt">🩺</div>
  </div>

  <div class="grid" id="homeServices"></div>
 </div>
 <footer>© 2026 AmarOsud · <span data-t="footer">Your health matters.</span></footer>
</section>

<section id="authPage" class="hidden">
 <div class="auth">
  <div class="authbox">

   <p class="small" data-t="authIntro">One account for all your healthcare needs.</p>
   <div id="authMessage" class="msg"></div>
   <form id="registerForm" class="hidden">
    <div class="field"><label data-t="name">Full Name</label><input id="regName" required maxlength="100"></div>
    <div class="field"><label data-t="phone">Mobile Number</label><input id="regPhone" required maxlength="20" placeholder="01XXXXXXXXX"></div>

    <div class="field"><label data-t="password">Password (minimum 8 characters)</label><input id="regPassword" type="password" minlength="8" required></div>
    <button class="btn primary full" id="regBtn" type="submit" data-t="create">Create Account</button>
   </form>
   <form id="loginForm">
    <div class="field"><label data-t="email">Email / Gmail</label><input id="loginEmail" type="email" required></div>
    <div class="field"><label data-t="passwordShort">Password</label><input id="loginPassword" type="password" required></div>
    <button class="btn primary full" id="loginBtn" type="submit" data-t="login">Login</button>
   </form>
   <div class="switch" id="authSwitch"></div>
   <div class="switch"><span class="link" onclick="showHome()" data-t="backHome">← Back to Home</span></div>
  </div>
 </div>
</section>

<section id="appPage" class="app">
 <div class="layout">
  <aside class="sidebar">
   <div class="userbox"><strong id="sideName">Welcome</strong><small id="sideEmail"></small></div>
   <div id="sideNav"></div>
  </aside>
  <div style="flex:1;min-width:0">
   <div class="mobileNav" id="mobileNav"></div>
   <main class="main" id="mainContent"></main>
  </div>
 </div>
</section>
<div id="moreMenu" class="moreMenu hidden"></div>

function renderHomeServices(){
 $("homeServices").innerHTML=services.map(s=>`
 <div class="card">
  <div class="serviceIcon">${s[0]}</div>
  <h3>${t(s[1])}</h3><p>${t(s[2])}</p>
  <button class="btn light" onclick="showAuth('login')">${t("login")} →</button>
 </div>`).join("");
}
function showHome(){
 $("homePage").classList.remove("hidden");
 $("authPage").classList.add("hidden");
 $("appPage").style.display="none";
 $("guestActions").classList.toggle("hidden",!!currentUser);
 $("memberActions").classList.toggle("hidden",!currentUser);
 $("moreMenu").classList.add("hidden");
}
function showAuth(mode){
 $("homePage").classList.add("hidden");
 $("appPage").style.display="none";
 $("authPage").classList.remove("hidden");
 hideMsg("authMessage");
 const register=mode==="register";
 $("registerForm").classList.toggle("hidden",!register);
 $("loginForm").classList.toggle("hidden",register);
 $("authTitle").textContent=register?t("register"):t("welcome");
 $("authSwitch").innerHTML=register
  ?`${t("switchLogin")} <span class="link" id="switchAuth">${t("switchToLogin")}</span>`
  :`${t("switchRegister")} <span class="link" id="switchAuth">${t("switchToRegister")}</span>`;
 $("switchAuth").onclick=()=>showAuth(register?"login":"register");
}
function renderNav(){
 const button=(item)=>`<button class="navbtn ${currentPage===item[1]?"active":""}" onclick="openPage('${item[1]}')"><span class="navicon">${item[0]}</span><span>${t(item[1])}</span></button>`;
 $("sideNav").innerHTML=primaryNav.concat(extraNav).map(button).join("");
 $("mobileNav").innerHTML=primaryNav.map(button).join("")+
 `<button class="navbtn" onclick="toggleMore()"><span class="navicon">☰</span><span>${t("more")}</span></button>`;
 $("moreMenu").innerHTML=`<strong style="display:block;padding:10px">${t("moreTitle")}</strong>`+
 extraNav.map(item=>`<button onclick="openPage('${item[1]}');toggleMore()">${item[0]} ${t(item[1])}</button>`).join("");
}
function toggleMore(){$("moreMenu").classList.toggle("hidden")}
function normalizePhone(value){
 let p=value.replace(/[^0-9+]/g,"");
 if(p.startsWith("+880"))return p;
 if(p.startsWith("880"))return "+"+p;
 if(p.startsWith("0"))return "+88"+p;
 return p;
}
function validPhone(p){return /^\+8801[3-9]\d{8}$/.test(p)}

async function ensureProfile(user){
 const {data,error}=await client.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error)throw error;
 if(data)return data;
 const meta=user.user_metadata||{};
 const profile={id:user.id,full_name:meta.full_name||user.email?.split("@")[0]||"User",phone:meta.phone||""};
 const {data:created,error:createError}=await client.from("profiles").insert(profile).select().single();
 if(createError)throw createError;
 return created;
}
async function enterApp(user){
 currentUser=user;
 try{currentProfile=await ensureProfile(user)}
 catch(e){
  console.error("Profile:",e);
  const meta=user.user_metadata||{};
  currentProfile={id:user.id,full_name:meta.full_name||user.email?.split("@")[0]||"User",phone:meta.phone||""};
 }
 $("homePage").classList.add("hidden");
 $("authPage").classList.add("hidden");
 $("appPage").style.display="block";
 $("guestActions").classList.add("hidden");
 $("memberActions").classList.remove("hidden");
 $("sideName").textContent=currentProfile.full_name||t("welcome");
 $("sideEmail").textContent=user.email||"";
 renderNav();
 openPage("dashboard");
}

function openPage(page){
 if(!currentUser){showAuth("login");return}
 currentPage=page;
 $("moreMenu").classList.add("hidden");
 renderNav();
 const name=safe(currentProfile?.full_name||"");
 let html="";
 if(page==="dashboard"){
  html=`<div class="head"><h1>${t("welcome")}, ${name} 👋</h1><span class="tag">${t("oneAccount")}</span></div>
  <h2>${t("dashboardTitle")}</h2><p class="small">${t("dashboardText")}</p>
  <div class="grid" style="margin-top:22px">${services.map(s=>`
   <div class="card"><div class="serviceIcon">${s[0]}</div><h3>${t(s[1])}</h3>
   <p>${t(s[2])}</p><button class="btn light" onclick="openPage('${s[1]}')">${t("getStarted")}</button></div>`).join("")}</div>
  <div class="notice">${t("safety")}</div>`;
 }else if(page==="profile"){
  html=`<div class="head"><h1>👤 ${t("profile")}</h1></div><div class="card" style="max-width:620px">
  <p>${t("profileText")}</p>
  <div class="field"><label>${t("nameLabel")}</label><input id="profileName" maxlength="100" value="${safe(currentProfile?.full_name)}"></div>
  <div class="field"><label>${t("phone")}</label><input id="profilePhone" value="${safe(currentProfile?.phone)}"></div>
  <div class="field"><label>${t("email")}</label><input value="${safe(currentUser.email)}" disabled></div>
  <button class="btn primary" onclick="saveProfile()">${t("save")}</button><div id="profileMessage" class="msg"></div></div>`;
 }else if(page==="medicine"){
  html=`<div class="head"><h1>💊 ${t("reminderTitle")}</h1></div><div class="card" style="max-width:700px">
  <p class="small">${t("reminderInfo")}</p>
  <form id="reminderForm">
   <div class="field"><label>${t("medicineName")}</label><input id="medicineName" maxlength="100" required></div>
   <div class="field"><label>${t("time")}</label><input id="medicineTime" type="time" required></div>
   <button class="btn primary" type="submit">${t("add")}</button>
  </form><div id="reminderMessage" class="msg"></div><div id="reminderList"></div></div>`;
 }else if(page==="settings"){
  html=`<div class="head"><h1>⚙️ ${t("settings")}</h1></div><div class="card">
  <p>${t("account")}: ${safe(currentUser.email)}</p><button class="btn outline" onclick="logout()">${t("logout")}</button></div>`;
 }else if(page==="history"){
  html=servicePage("📚","history","historyInfo","Medicine history will be available after secure database setup.");
 }else{
  const content={
   doctors:["👨‍⚕️","doctors","doctorText"],
   appointments:["📅","appointments","appointmentText"],
   records:["📋","records","recordsText"],
   pharmacy:["🏥","pharmacy","pharmacyText"],
   diagnostics:["🧪","diagnostics","diagnosticText"]
  }[page];
  html=servicePage(content[0],content[1],content[2]);
 }
 $("mainContent").innerHTML=html;
 if(page==="medicine")renderReminders();
}
function servicePage(icon,title,description){
 return `<div class="head"><h1>${icon} ${t(title)}</h1><span class="tag">${t("coming")}</span></div>
 <div class="card" style="max-width:720px"><p>${t(description)}</p>
 <div class="notice">${t("safety")}</div>
 <button class="btn light" onclick="openPage('dashboard')">${t("back")}</button></div>`;
}

async function saveProfile(){
 const full_name=$("profileName").value.trim();
 const phone=normalizePhone($("profilePhone").value.trim());
 if(!full_name||!phone){showMsg("profileMessage",t("nameError"),"err");return}
 if(!validPhone(phone)){showMsg("profileMessage",t("phoneError"),"err");return}
 const {data,error}=await client.from("profiles").update({full_name,phone}).eq("id",currentUser.id).select().single();
 if(error){showMsg("profileMessage",t("profileError")+error.message,"err");return}
 currentProfile=data;
 $("sideName").textContent=full_name;
 showMsg("profileMessage",t("saved"));
}

function reminderKey(){return "amarosud_reminders_"+currentUser.id}
function getReminders(){try{return JSON.parse(localStorage.getItem(reminderKey())||"[]")}catch(e){return []}}
function saveReminders(items){localStorage.setItem(reminderKey(),JSON.stringify(items))}
function renderReminders(){
 const list=$("reminderList");if(!list)return;
 const items=getReminders().sort((a,b)=>a.time.localeCompare(b.time));
 if(!items.length){list.innerHTML=`<p class="small">${t("noReminder")}</p>`;return}
 list.innerHTML=items.map(item=>`<div class="item"><div><strong>${safe(item.name)}</strong><br><small>${safe(item.time)}</small></div>
 <button class="btn outline" onclick="deleteReminder('${safe(item.id)}')">${t("delete")}</button></div>`).join("");
}
function addReminder(event){
 event.preventDefault();
 const name=$("medicineName").value.trim(),time=$("medicineTime").value;
 if(!name||!time){showMsg("reminderMessage",t("required"),"err");return}
 const items=getReminders();items.push({id:Date.now().toString(),name,time});
 saveReminders(items);$("reminderForm").reset();
 showMsg("reminderMessage",t("reminderSaved"));renderReminders();
}
function deleteReminder(id){saveReminders(getReminders().filter(x=>x.id!==id));renderReminders()}

$("registerForm").addEventListener("submit",async event=>{
 event.preventDefault();hideMsg("authMessage");
 const btn=$("regBtn");btn.disabled=true;btn.textContent=t("registering");
 const full_name=$("regName").value.trim();
 const phone=normalizePhone($("regPhone").value.trim());
 const email=$("regEmail").value.trim().toLowerCase();
 const password=$("regPassword").value;
 try{
  if(!validPhone(phone))throw new Error(t("phoneError"));
  const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name,phone}}});
  if(error)throw error;
  if(data.session&&data.user){
   const {error:profileError}=await client.from("profiles").upsert({id:data.user.id,full_name,phone});
   if(profileError)throw profileError;
   await enterApp(data.user);
  }else{
   showAuth("login");showMsg("authMessage",t("emailConfirm"));
  }
 }catch(e){showMsg("authMessage",e.message||t("registerError"),"err")}
 finally{btn.disabled=false;btn.textContent=t("create")}
});

$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();hideMsg("authMessage");
 const btn=$("loginBtn");btn.disabled=true;btn.textContent=t("logging");
 try{
  const email=$("loginEmail").value.trim().toLowerCase();
  const password=$("loginPassword").value;
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(!data.user)throw new Error(t("loginError"));
  await enterApp(data.user);
 }catch(e){showMsg("authMessage",e.message||t("loginError"),"err")}
 finally{btn.disabled=false;btn.textContent=t("login")}
});

async function logout(){
 const {error}=await client.auth.signOut();
 if(error){alert(error.message);return}
 currentUser=null;currentProfile=null;showHome();
}
client.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){currentUser=null;currentProfile=null;showHome()}
});
function init(){
 updateLanguage();showHome();
 $("mainContent").addEventListener("submit",event=>{
  if(event.target.id==="reminderForm")addReminder(event);
 });
 client.auth.getSession().then(async({data,error})=>{
  if(error){console.error(error);return}
  if(data.session?.user)await enterApp(data.session.user);
 });
}
init();
</script>
</body>
</html>
