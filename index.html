
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>AmarOsud | Healthcare Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#087f5b;--d:#07543e;--l:#e9f7f1;--bg:#f5f8f7;--t:#18352b;--m:#718078;--b:#e3ebe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,"Noto Sans Bengali",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.top{height:68px;background:white;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:10}
.logo{font-size:23px;font-weight:800;color:var(--g)}
.logo span{color:var(--t)}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700}
.primary{background:var(--g);color:white}
.secondary{background:var(--l);color:var(--g)}
.outline{background:white;border:1px solid var(--b);color:var(--t)}
.btn:disabled{opacity:.6}
.container{max-width:1150px;margin:auto;padding:28px 20px}
.hero{background:linear-gradient(120deg,#07543e,#0b9870);border-radius:20px;padding:48px 32px;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:270px}
.hero h1{font-size:40px;line-height:1.2;margin:0 0 15px}
.hero p{max-width:570px;line-height:1.8;color:#e2f5ed}
.hero .btn{background:white;color:var(--g);margin-top:10px}
.heroIcon{font-size:90px}
h2.section{margin:34px 0 17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border:1px solid var(--b);border-radius:15px;padding:20px;box-shadow:0 3px 12px #173b2b08}
.card h3{margin:10px 0 8px}
.card p{color:var(--m);font-size:14px;line-height:1.7}
.icon{font-size:30px}
.auth{max-width:450px;margin:38px auto;padding:0 15px}
.authbox{background:white;border:1px solid var(--b);border-radius:18px;padding:26px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.field input{width:100%;padding:13px;border:1px solid var(--b);border-radius:9px;outline:none}
.field input:focus{border-color:var(--g)}
.full{width:100%}
.msg{display:none;padding:12px;border-radius:9px;margin:12px 0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.ok{background:#e9f7ef;color:#17613f}
.err{background:#fff0ef;color:#a32c25}
.switch{text-align:center;color:var(--m);font-size:14px;margin-top:16px}
.link{color:var(--g);font-weight:bold;cursor:pointer}
.hidden{display:none!important}
.app{display:none;min-height:calc(100vh - 68px)}
.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{width:245px;background:white;border-right:1px solid var(--b);padding:20px 13px;flex-shrink:0}
.userbox{background:var(--l);padding:14px;border-radius:12px;margin-bottom:17px;overflow-wrap:anywhere}
.userbox strong{display:block;margin-bottom:5px}
.navbtn{display:block;width:100%;padding:12px;margin:4px 0;border:0;background:white;border-radius:9px;text-align:left;color:#52665c;font-weight:600}
.navbtn.active,.navbtn:hover{background:var(--l);color:var(--g)}
.main{flex:1;min-width:0;padding:25px}
.mobileNav{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.head h1{font-size:25px;margin:0}
.tag{background:var(--l);color:var(--g);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}
.notice{background:#fff8e7;border:1px solid #f2e4bd;padding:14px;border-radius:12px;color:#70551b;font-size:13px;line-height:1.7;margin:15px 0}
.small{font-size:12px;color:var(--m);line-height:1.6}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--b)}
footer{text-align:center;padding:28px;color:var(--m);font-size:13px}
@media(max-width:800px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .layout{display:block}
 .sidebar{display:none}
 .mobileNav{display:flex;overflow-x:auto;background:white;border-bottom:1px solid var(--b);padding:7px;gap:5px;position:sticky;top:68px;z-index:4}
 .mobileNav .navbtn{white-space:nowrap;width:auto;margin:0;padding:10px}
 .main{padding:18px 13px}
 .hero{padding:32px 22px}
 .hero h1{font-size:31px}
}
@media(max-width:480px){
 .grid{grid-template-columns:1fr}
 .heroIcon{display:none}
 .top{padding:0 12px}
 .logo{font-size:20px}
}
</style>
</head>
<body>

<header class="top">
 <div class="logo">💚 Amar<span>Osud</span></div>
 <div class="actions">
  <button class="btn outline" id="languageBtn" onclick="toggleLanguage()">বাংলা</button>
  <div id="topActions">
   <button class="btn outline" onclick="showAuth('login')" data-t="login">Login</button>
   <button class="btn primary" onclick="showAuth('register')" data-t="register">Register</button>
  </div>
  <div id="loggedActions" class="hidden">
   <button class="btn outline" onclick="logout()" data-t="logout">Logout</button>
  </div>
 </div>
</header>

<section id="homePage">
 <div class="container">
  <div class="hero">
   <div>
    <h1 data-t="heroTitle">Your Health,<br>One Platform.</h1>
    <p data-t="heroText">Manage your health information and explore healthcare services from one place.</p>
    <button class="btn" onclick="showAuth('register')" data-t="start">Get Started →</button>
   </div>
   <div class="heroIcon">🩺</div>
  </div>
  <h2 class="section" data-t="services">Explore Our Services</h2>
  <div class="grid" id="homeServices"></div>
 </div>
 <footer>© 2026 AmarOsud · <span data-t="footer">Your health matters.</span></footer>
</section>

<section id="authPage" class="hidden">
 <div class="auth">
  <div class="authbox">
   <h2 id="authTitle">Welcome Back</h2>
   <p class="small" data-t="authIntro">Access your AmarOsud account.</p>
   <div id="authMessage" class="msg"></div>

   <form id="registerForm" class="hidden">
    <div class="field"><label data-t="name">Full Name</label><input id="regName" required maxlength="100" autocomplete="name"></div>
    <div class="field"><label data-t="phone">Mobile Number</label><input id="regPhone" required maxlength="20" placeholder="01XXXXXXXXX"></div>
    <div class="field"><label data-t="email">Email / Gmail</label><input id="regEmail" type="email" required autocomplete="email"></div>
    <div class="field"><label data-t="password">Password (minimum 8 characters)</label><input id="regPassword" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn primary full" id="regBtn" type="submit" data-t="create">Create Account</button>
   </form>

   <form id="loginForm">
    <div class="field"><label data-t="email">Email / Gmail</label><input id="loginEmail" type="email" required autocomplete="email"></div>
    <div class="field"><label data-t="passwordShort">Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
    <button class="btn primary full" id="loginBtn" type="submit" data-t="login">Login</button>
   </form>

   <div class="switch" id="authSwitch"></div>
   <div class="switch"><span class="link" onclick="showHome()" data-t="back">← Back to Home</span></div>
  </div>
 </div>
</section>

<section id="appPage" class="app">
 <div class="layout">
  <aside class="sidebar">
   <div class="userbox"><strong id="sideName">Welcome</strong><small id="sideEmail"></small></div>
   <div id="sideNav"></div>
  </aside>
  <div style="flex:1;min-width:0">
   <div class="mobileNav" id="mobileNav"></div>
   <main class="main" id="mainContent"></main>
  </div>
 </div>
</section>

];

function $(id){return document.getElementById(id)}
function t(key){return translations[lang][key]||translations.en[key]||key}
function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function msg(id,text,type="ok"){
 const box=$(id);
 box.textContent=text;
 box.className="msg "+type;
 box.style.display="block";
}
function hideMsg(id){$(id).style.display="none"}

function toggleLanguage(){
 lang=lang==="en"?"bn":"en";
 localStorage.setItem("amarosud_language",lang);
 document.documentElement.lang=lang;
 updateLanguage();
 if(currentUser){renderNav();openPage(currentPage)}
 else if(!$("authPage").classList.contains("hidden")){
  showAuth($("registerForm").classList.contains("hidden")?"login":"register");
 }
}
function updateLanguage(){
 document.querySelectorAll("[data-t]").forEach(node=>{
  node.innerHTML=t(node.dataset.t);
 });
 $("languageBtn").textContent=t("language");
 renderServices();
}
function renderServices(){
 $("homeServices").innerHTML=services.map(s=>`
  <div class="card">
   <div class="icon">${s[0]}</div>
   <h3>${t(s[1])}</h3><p>${t(s[2])}</p>
   <button class="btn secondary" onclick="showAuth('login')">${t("login")}</button>
  </div>`).join("");
}

function showHome(){
 $("homePage").classList.remove("hidden");
 $("authPage").classList.add("hidden");
 $("appPage").style.display="none";
 $("topActions").classList.toggle("hidden",!!currentUser);
 $("loggedActions").classList.toggle("hidden",!currentUser);
}
function showAuth(mode){
 $("homePage").classList.add("hidden");
 $("appPage").style.display="none";
 $("authPage").classList.remove("hidden");
 hideMsg("authMessage");
 const isRegister=mode==="register";
 $("registerForm").classList.toggle("hidden",!isRegister);
 $("loginForm").classList.toggle("hidden",isRegister);
 $("authTitle").textContent=isRegister?t("register"):t("welcome");
 $("authSwitch").innerHTML=isRegister
  ?`${t("switchLogin")} <span class="link" onclick="showAuth('login')">${t("login")}</span>`
  :`${t("switchRegister")} <span class="link" onclick="showAuth('register')">${t("register")}</span>`;
}
function renderNav(){
 const html=navItems.map(item=>`
  <button class="navbtn ${currentPage===item[1]?"active":""}"
   onclick="openPage('${item[1]}')">${item[0]} ${t(item[1])}</button>
 `).join("");
 $("sideNav").innerHTML=html;
 $("mobileNav").innerHTML=html;
}

function normalizePhone(value){
 let p=value.replace(/[^0-9+]/g,"");
 if(p.startsWith("+880"))return p;
 if(p.startsWith("880"))return "+"+p;
 if(p.startsWith("0"))return "+88"+p;
 return p;
}
function validPhone(p){return /^\+8801[3-9]\d{8}$/.test(p)}

/* LOAD OR CREATE PROFILE */
async function ensureProfile(user){
 const {data,error}=await client.from("profiles")
  .select("*").eq("id",user.id).maybeSingle();
 if(error)throw error;
 if(data)return data;

 const meta=user.user_metadata||{};
 const profile={
  id:user.id,
  full_name:meta.full_name||user.email?.split("@")[0]||"User",
  phone:meta.phone||""
 };
 const {data:created,error:createError}=await client.from("profiles")
  .insert(profile).select().single();
 if(createError)throw createError;
 return created;
}

/* ENTER DASHBOARD */
async function enterApp(user){
 currentUser=user;
 try{
  currentProfile=await ensureProfile(user);
 }catch(error){
  console.error("Profile loading:",error);
  const meta=user.user_metadata||{};
  currentProfile={
   id:user.id,
   full_name:meta.full_name||user.email?.split("@")[0]||"User",
   phone:meta.phone||""
  };
 }
 $("homePage").classList.add("hidden");
 $("authPage").classList.add("hidden");
 $("appPage").style.display="block";
 $("topActions").classList.add("hidden");
 $("loggedActions").classList.remove("hidden");
 $("sideName").textContent=currentProfile.full_name||t("welcome");
 $("sideEmail").textContent=user.email||"";
 renderNav();
 openPage("dashboard");
}

/* DASHBOARD PAGES */
function openPage(page){
 if(!currentUser){showAuth("login");return}
 currentPage=page;
 renderNav();
 const name=safe(currentProfile?.full_name||"User");
 let html="";

 if(page==="dashboard"){
  const items=[
   ["💊","reminders"],["📋","records"],["👨‍⚕️","doctors"],
   ["🏥","pharmacy"],["🧪","diagnostics"],["👤","profile"]
  ];
  html=`<div class="head"><h1>${t("welcome")}, ${name} 👋</h1><span class="tag">${t("dashboard")}</span></div>
  <p style="color:var(--m)">${t("welcomeText")}</p>
  <div class="grid">${items.map(item=>`
   <div class="card"><div class="icon">${item[0]}</div><h3>${t(item[1])}</h3>
   <button class="btn secondary" onclick="openPage('${item[1]}')">${t("start")}</button></div>
  `).join("")}</div>
  <div class="notice">${t("dashboardNote")}</div>`;
 }
 else if(page==="profile"){
  html=`<div class="head"><h1>👤 ${t("profile")}</h1></div>
   <div class="card" style="max-width:620px">
    <p>${t("profileText")}</p>
    <div class="field"><label>${t("name")}</label><input id="profileName" maxlength="100" value="${safe(currentProfile?.full_name)}"></div>
    <div class="field"><label>${t("phone")}</label><input id="profilePhone" value="${safe(currentProfile?.phone)}"></div>
    <div class="field"><label>${t("email")}</label><input value="${safe(currentUser.email)}" disabled></div>
    <button class="btn primary" onclick="saveProfile()">${t("save")}</button>
    <div id="profileMessage" class="msg"></div>
   </div>`;
 }
 else if(page==="reminders"){
  html=`<div class="head"><h1>💊 ${t("reminders")}</h1></div>
   <div class="card" style="max-width:700px">
    <p>${t("reminderInfo")}</p>
    <form id="reminderForm">
     <div class="field"><label>${t("medicineName")}</label><input id="medicineName" maxlength="100" required></div>
     <div class="field"><label>${t("medicineTime")}</label><input id="medicineTime" type="time" required></div>
     <button class="btn primary" type="submit">${t("addReminder")}</button>
    </form>
    <div id="reminderMessage" class="msg"></div>
    <h3>${t("reminderTitle")}</h3>
    <div id="reminderList"></div>
   </div>`;
 }
 else if(page==="settings"){
  html=`<div class="head"><h1>⚙️ ${t("settings")}</h1></div>
   <div class="card"><p>${t("settingsInfo")}</p>
   <p>${safe(currentUser.email)}</p>
   <button class="btn outline" onclick="logout()">${t("logout")}</button></div>`;
 }
 else{
  const info={
   history:["📚","history","historyInfo"],
   records:["📋","records","recordsInfo"],
   doctors:["👨‍⚕️","doctors","doctorsInfo"],
   pharmacy:["🏥","pharmacy","pharmacyInfo"],
   diagnostics:["🧪","diagnostics","diagnosticsInfo"]
  }[page];
  html=`<div class="head"><h1>${info[0]} ${t(info[1])}</h1><span class="tag">${t("coming")}</span></div>
   <div class="card" style="max-width:700px">
    <p>${t(info[2])}</p>
    <div class="notice">${t("dashboardNote")}</div>
    <button class="btn secondary" onclick="openPage('dashboard')">${t("backDashboard")}</button>
   </div>`;
 }
 $("mainContent").innerHTML=html;
 if(page==="reminders")renderReminders();
}

/* SAVE PROFILE */
async function saveProfile(){
 const full_name=$("profileName").value.trim();
 const phone=normalizePhone($("profilePhone").value.trim());
 if(!full_name||!phone){msg("profileMessage",t("nameRequired"),"err");return}
 if(!validPhone(phone)){msg("profileMessage",t("phoneInvalid"),"err");return}
 const {data,error}=await client.from("profiles")
  .update({full_name,phone}).eq("id",currentUser.id).select().single();
 if(error){msg("profileMessage",t("profileError")+error.message,"err");return}
 currentProfile=data;
 $("sideName").textContent=full_name;
 msg("profileMessage",t("saved"));
}

/* MEDICINE REMINDERS */
function reminderKey(){return "amarosud_reminders_"+currentUser.id}
function getReminders(){
 try{return JSON.parse(localStorage.getItem(reminderKey())||"[]")}
 catch(e){return []}
}
function saveReminders(items){
 localStorage.setItem(reminderKey(),JSON.stringify(items));
}
function renderReminders(){
 const list=$("reminderList");
 if(!list)return;
 const items=getReminders().sort((a,b)=>a.time.localeCompare(b.time));
 if(!items.length){list.innerHTML=`<p class="small">${t("noReminder")}</p>`;return}
 list.innerHTML=items.map(item=>`
  <div class="item">
   <div><strong>${safe(item.name)}</strong><br><small>${safe(item.time)}</small></div>
   <button class="btn outline" onclick="deleteReminder('${safe(item.id)}')">${t("delete")}</button>
  </div>`).join("");
}
function addReminder(event){
 event.preventDefault();
 const name=$("medicineName").value.trim();
 const time=$("medicineTime").value;
 if(!name||!time){msg("reminderMessage",t("reminderRequired"),"err");return}
 const items=getReminders();
 items.push({id:Date.now().toString(),name,time});
 saveReminders(items);
 $("reminderForm").reset();
 msg("reminderMessage",t("reminderSaved"));
 renderReminders();
}
function deleteReminder(id){
 saveReminders(getReminders().filter(item=>item.id!==id));
 renderReminders();
}

/* REGISTER */
$("registerForm").addEventListener("submit",async event=>{
 event.preventDefault();
 hideMsg("authMessage");
 const btn=$("regBtn");
 btn.disabled=true;
 btn.textContent=lang==="bn"?"তৈরি হচ্ছে...":"Creating account...";
 const full_name=$("regName").value.trim();
 const phone=normalizePhone($("regPhone").value.trim());
 const email=$("regEmail").value.trim().toLowerCase();
 const password=$("regPassword").value;

 try{
  if(!validPhone(phone))throw new Error(t("phoneInvalid"));
  const {data,error}=await client.auth.signUp({
   email,password,
   options:{data:{full_name,phone}}
  });
  if(error)throw error;
  if(data.session&&data.user){
   const {error:profileError}=await client.from("profiles").insert({
    id:data.user.id,full_name,phone
   });
   if(profileError)console.warn("Profile insert:",profileError.message);
   await enterApp(data.user);
  }else{
   showAuth("login");
   msg("authMessage",t("emailConfirm"));
  }
 }catch(error){
  msg("authMessage",error.message||t("registerFailed"),"err");
 }finally{
  btn.disabled=false;
  btn.textContent=t("create");
 }
});

/* LOGIN */
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 hideMsg("authMessage");
 const btn=$("loginBtn");
 btn.disabled=true;
 btn.textContent=lang==="bn"?"লগইন হচ্ছে...":"Logging in...";
 try{
  const email=$("loginEmail").value.trim().toLowerCase();
  const password=$("loginPassword").value;
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(!data.user)throw new Error(t("loginFailed"));
  await enterApp(data.user);
 }catch(error){
  msg("authMessage",error.message||t("loginFailed"),"err");
 }finally{
  btn.disabled=false;
  btn.textContent=t("login");
 }
});

/* LOGOUT AND SESSION */
async function logout(){
 const {error}=await client.auth.signOut();
 if(error){console.error(error);return}
 currentUser=null;
 currentProfile=null;
 showHome();
}
client.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  currentProfile=null;
  showHome();
 }
});

/* START WEBSITE */
function init(){
 updateLanguage();
 showHome();
 $("mainContent").addEventListener("submit",event=>{
  if(event.target.id==="reminderForm")addReminder(event);
 });
 client.auth.getSession().then(async result=>{
  if(result.error){console.error(result.error);return}
  if(result.data.session?.user)await enterApp(result.data.session.user);
 });
}
init();
</script>
